<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAC Prudente - App de Pedidos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0d47a1 0%, #1976d2 50%, #42a5f5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .badge {
            background: #ff9800;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #1976d2;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .card p {
            color: #666;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(25, 118, 210, 0.4);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(25, 118, 210, 0.5);
        }

        .footer {
            margin-top: 40px;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛒</div>
        <h1>MAC Atacado</h1>
        <div class="badge">PRESIDENTE PRUDENTE</div>
        <p class="subtitle">Sistema de Pedidos Digital</p>

        <div class="card">
            <h2>📱 App de Pedidos</h2>
            <p>Acesse o catálogo completo, monte seus pedidos e exporte para Excel.</p>
            <a href="app/" class="btn">Acessar App</a>
        </div>

        <div class="footer">
            <p>MAC Atacado - Presidente Prudente</p>
        </div>
    </div>
</body>
</html>
